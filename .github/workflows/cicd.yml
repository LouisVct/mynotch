name: Build for macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build MyNotch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40

      - name: Ad-hoc sign and create DMG
        run: |
          set -e
          APP="build/Build/Products/Release/MyNotch.app"
          codesign --force --deep --sign - "$APP"
          mkdir stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname MyNotch -srcfolder stage -ov -format UDZO MyNotch.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MyNotch
          path: MyNotch.dmg

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MyNotch.dmg \
            --title "MyNotch build ${{ github.run_number }}" \
            --generate-notes \
            --target "${{ github.sha }}"
